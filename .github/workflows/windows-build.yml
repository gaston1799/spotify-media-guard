name: Windows build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm run package:win
      - uses: actions/upload-artifact@v4
        with:
          name: spotify-media-guard-win32-x64
          path: dist/Spotify Media Guard-win32-x64
